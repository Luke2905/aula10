# Configuração SonarQube - Aula 10 (CI/CD com Automação de Qualidade)
sonar.projectKey=Luke2905_aula10
sonar.projectName=Aula 10 - Integracao Continua e Automacao de Qualidade
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=17
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Relatórios integrados ao Quality Gate
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports,target/failsafe-reports
sonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
sonar.java.pmd.reportPaths=target/pmd.xml

# Regras configuradas no Quality Gate (Atividade 3):
# - Cobertura mínima: 80% (85% no Desafio Integrado)
# - Zero bugs críticos (critical_violations = 0 / blocker_violations = 0)
# - Debt técnico < 1h (sqale_index <= 60 min)
sonar.qualitygate.wait=true
